name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project_airflow_etl/requirements.txt
          pip install pytest pytest-pythonpath

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/project_airflow_etl/src" >> $GITHUB_ENV

      - name: Run tests
        run: |
          pytest project_airflow_etl/test/ --disable-warnings --maxfail=2