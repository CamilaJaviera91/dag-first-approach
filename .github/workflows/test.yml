name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpq-dev python3-dev

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install -r project_airflow_etl/requirements.txt -c project_airflow_etl/constraints.txt

    - name: Run tests
      run: |
        pytest project_airflow_etl/test/ --disable-warnings --maxfail=2